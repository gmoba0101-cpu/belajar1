<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnumbet Mobile Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #06102e;
      color: #ffffff;
      padding-top: 60px;
    }

    /* HEADER */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #030a21;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 1000;
      border-bottom: 1px solid #10204d;
    }

    .hamburger-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 26px;
      cursor: pointer;
      padding: 5px 10px;
      z-index: 1001;
    }

    .logo {
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-login {
      background-color: #e6ab08;
      color: #000;
      border: none;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    /* SIDEBAR NAVIGATOR */
    .sidebar {
      position: fixed;
      top: 60px;
      left: 0;
      width: 90px;
      height: calc(100vh - 60px);
      background-color: #030a21;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 999;
      border-right: 1px solid #10204d;
    }

    .sidebar.active {
      transform: translateX(0);
    }
    /* Provider Bar */
        .provider-bar {
            background-color: #0b1a75;
            border-radius: 5px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            overflow-x: auto;
        }

        .provider-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #ffffff;
            text-decoration: none;
            cursor: pointer;
            min-width: 80px;
            transition: transform 0.2s, opacity 0.2s;
        }

        .provider-item:hover, .provider-item.active {
            opacity: 0.8;
            transform: translateY(-2px);
        }

        .provider-icon {
            width: 40px;
            height: 40px;
            background-color: #fa010e;
            border-radius: 50%;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }

    .nav-item {
      width: 100%;
      padding: 15px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #8fa0c9;
      font-size: 10px;
      font-weight: bold;
      border-bottom: 1px solid #0b1942;
    }

    .nav-item:hover, .nav-item.active {
      color: #ffffff;
      background-color: #0b1a4a;
    }

    .nav-item .icon {
      font-size: 20px;
      margin-bottom: 4px;
    }

    /* OVERLAY */
    .overlay {
      position: fixed;
      top: 60px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 60px);
      background: rgba(0, 0, 0, 0.7);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      z-index: 998;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* MAIN CONTENT & GAME GRID */
    .container {
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #ffcc00;
      text-transform: uppercase;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .game-card {
      background-color: #0b1942;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #182b66;
    }

    .game-img {
      width: 100%;
      height: 110px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .badge {
      position: absolute;
      top: 5px;
      left: 5px;
      background-color: #ff0055;
      color: #fff;
      font-size: 9px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .game-info {
      padding: 8px;
    }

    .game-name {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* BAR RTP */
    .rtp-container {
      background-color: #030a21;
      border-radius: 10px;
      height: 16px;
      position: relative;
      overflow: hidden;
    }

    .rtp-bar {
      height: 100%;
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .rtp-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
      
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <button id="hamburgerBtn" class="hamburger-btn">☰</button>
    <div class="logo">MAGNUMBET</div>
    <div class="header-actions">
      <button class="btn-login">LOGIN</button>
    </div>
  </header>

  <!-- SIDEBAR NAVIGATION -->
  <aside id="sidebar" class="sidebar">
    <a href="#" class="nav-item active">
      <span class="icon">🏠</span>
      <span>HOME</span>
    </a>
    <a href="#" class="nav-item">
      <span class="icon">🎮</span>
      <span>PERMAINAN</span>
    </a>
    <a href="#" class="nav-item">
      <span class="icon">🎁</span>
      <span>PROMOSI</span>
    </a>
    <a href="#" class="nav-item">
      <span class="icon">👥</span>
      <span>REFERRAL</span>
    </a>
    <a href="#" class="nav-item">
      <span class="icon">ℹ️</span>
      <span>INFO</span>
    </a>
  </aside>
                <!-- Provider Bar dengan Link -->
        <div class="provider-bar">
            <a href="pragmatic.html" class="provider-item active">
                <div class="provider-icon" style="background-color: rgba(255, 255, 255, 0.5);">PP</div>
                <span>Pragmatic Play</span>
            </a>
            <a href="pppop.html" class="provider-item">
                <div class="provider-icon">POP</div>
                <span>PP Pop</span>
            </a>
            <a href="pgsoft.html" class="provider-item">
                <div class="provider-icon">PG</div>
                <span>PG Soft</span>
            </a>
            <a href="slot88.html" class="provider-item">
                <div class="provider-icon">S88</div>
                <span>Slot88 x PP</span>
            </a>
            <a href="fachai.html" class="provider-item">
                <div class="provider-icon">FC</div>
                <span>Fachai</span>
            </a>
            <a href="nolimit.html" class="provider-item">
                <div class="provider-icon">JL</div>
                <span>nolimit city</span>
            </a>
        </div>

        <p class="subtext">Nilai dari RTP ini diambil dari persentase kemenangan member dan diperbarui secara otomatis.</p>

  <!-- OVERLAY -->
  <div id="overlay" class="overlay"></div>

  <!-- MAIN CONTENT -->
  <main class="container">
    <div class="section-title">Pragmatic Play Hari Ini</div>
    
    <div class="game-grid" id="gameGrid">
      <!-- Game cards diproduksi lewat JavaScript -->
    </div>
  </main>

<script>
  // DATA GAME PRAGMATIC PLAY INITIAL
  let games = [
    { id: 1, name: "Gates of Olympus", rtp: 98, badge: "HOT", img: "https://dsuown9evwz4y.cloudfront.net/Images/providers/PP/vs20olympx.jpg" },
    { id: 2, name: "Gates of Olympus", rtp: 70, badge: "HOT", img: "https://picsum.photos/200/150?random=2" },
    { id: 3, name: "Gates of Olympus", rtp: 88, badge: "HOT", img: "https://picsum.photos/200/150?random=3" },
    { id: 4, name: "Gates of Olympus", rtp: 75, badge: "HOT", img: "https://picsum.photos/200/150?random=4" },
    { id: 5, name: "Gates of Olympus", rtp: 65, badge: "HOT", img: "https://picsum.photos/200/150?random=5" },
    { id: 6, name: "Gates of Olympus", rtp: 88, badge: "HOT", img: "https://picsum.photos/200/150?random=6" },
    { id: 7, name: "Gates of Olympus", rtp: 76, badge: "HOT", img: "https://picsum.photos/200/150?random=7" },
    { id: 8, name: "Gates of Olympus", rtp: 78, badge: "HOT", img: "https://picsum.photos/200/150?random=8" },
    { id: 9, name: "Gates of Olympus", rtp: 98, badge: "HOT", img: "https://picsum.photos/200/150?random=9" },
    { id: 10, name: "Starlight Princess", rtp: 95, badge: "TOP", img: "https://picsum.photos/200/150?random=10" },
    { id: 11, name: "Sweet Bonanza", rtp: 91, badge: "POPULAR", img: "https://picsum.photos/200/150?random=11" },
    { id: 12, name: "Sugar Rush", rtp: 88, badge: "HOT", img: "https://picsum.photos/200/150?random=12" },
    { id: 13, name: "Wild West Gold", rtp: 82, badge: "NEW", img: "https://picsum.photos/200/150?random=13" },
    { id: 14, name: "Aztec Gems", rtp: 75, badge: "MINI", img: "https://picsum.photos/200/150?random=14" },
    { id: 15, name: "Power of Thor", rtp: 68, badge: "EPIC", img: "https://picsum.photos/200/150?random=15" },
    { id: 16, name: "Joker's Jewels", rtp: 60, badge: "CLASSIC", img: "https://picsum.photos/200/150?random=16" }
  ];

  const gameGrid = document.getElementById('gameGrid');

  // FUNGSI MENENTUKAN WARNA BAR
  function getRtpColor(rtp) {
    if (rtp >= 90) return '#00c853'; // Hijau (Tinggi)
    if (rtp >= 75) return '#ffab00'; // Kuning (Sedang)
    return '#d50000'; // Merah (Rendah)
  }

  // FUNGSI RENDER GAME KE HALAMAN
  function renderGames() {
    gameGrid.innerHTML = '';
    games.forEach(game => {
      const color = getRtpColor(game.rtp);
const cardHTML = `
<a href="https://magnumbetasli.com/" target="_blank" style="text-decoration: none; color: inherit; display: block;">    
      <div class="game-card">
      <div class="game-img" style="background-image: url('${game.img}')">
        <span class="badge">${game.badge}</span>
      </div>
      <div class="game-info">
        <div class="game-name">${game.name}</div>
        <div class="rtp-container">
          <div class="rtp-bar" style="width: ${game.rtp}%; background-color: ${color}"></div>
          <div class="rtp-text">RTP ${game.rtp}%</div>
        </div>
      </div>
    </div>
  </a>
`;
      gameGrid.innerHTML += cardHTML;
    });
  }

  // FUNGSI UPDATE RTP SECARA ACAK (Rentang 60% - 98%)
  function updateRTP() {
    games = games.map(game => {
      // Menghasilkan angka acak antara 60 dan 98
      const randomRTP = Math.floor(Math.random() * (98 - 60 + 1)) + 60;
      return { ...game, rtp: randomRTP };
    });
    
    // Tampilkan ulang game dengan data RTP baru
    renderGames();
    console.log("RTP berhasil diperbarui secara otomatis!");
  }

  // TAMPILKAN GAME PERTAMA KALI
  renderGames();

  // ATUR TIMER: 20 Menit = 20 * 60 * 1000 ms = 1.200.000 ms
  const TWENTY_MINUTES = 20 * 60 * 1000;
  setInterval(updateRTP, TWENTY_MINUTES);

  // LOGIKA SIDEBAR TOGGLE
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');

  function toggleMenu(e) {
    if (e) e.stopPropagation();
    sidebar.classList.toggle('active');
    overlay.classList.toggle('active');
  }

  hamburgerBtn.addEventListener('click', toggleMenu);
  overlay.addEventListener('click', toggleMenu);
</script>
</body>
</html>
